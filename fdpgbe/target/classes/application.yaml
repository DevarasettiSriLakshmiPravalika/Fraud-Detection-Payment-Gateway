spring:
  application:
    name: fdpg-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/fdpg
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: averylongsecretkeythatisatleast256bitslongforhs256!
  expiration: 86400000 # 24 hours
